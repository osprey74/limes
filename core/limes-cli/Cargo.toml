[package]
name = "limes-cli"
description = "Command line front end of limes-core for the Limes data pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "limes-cli"
path = "src/main.rs"

[dependencies]
limes-core = { path = "../limes-core" }
pmtiles = { version = "0.28.0", default-features = false, features = ["write"] }
serde.workspace = true
serde_json.workspace = true
