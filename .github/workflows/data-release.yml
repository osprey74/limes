# Daily: detect a new JARTIC release, rebuild the prefectures it changes, gate
# them and publish what passed to Cloudflare R2 (see data-pipeline/limes_pipeline/release.py).
#
#   plan     which prefectures to build, grouped by OSM region
#   build    one job per region, in parallel
#   publish  merge the regions' outputs, upload, prune old builds, report failures
#
# Repository settings:
#   secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (R2 API token, Object Read & Write)
#   variable R2_BUCKET
name: data-release

on:
  schedule:
    - cron: "30 21 * * *" # 06:30 JST
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if built from the current release
        type: boolean
        default: false
      only:
        description: Prefectures to build, space separated (default all in prefectures.json)
        type: string
        default: ""

concurrency:
  group: data-release
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # Newer AWS CLI checksum headers are not needed by R2.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  BUCKET: s3://${{ vars.R2_BUCKET }}

defaults:
  run:
    working-directory: data-pipeline

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      regions: ${{ steps.plan.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: Fetch published state
        run: |
          mkdir -p data/published
          aws s3 cp "$BUCKET/state.json" data/published/ --endpoint-url "$R2_ENDPOINT" || echo "no state.json yet"

      - name: Plan
        id: plan
        env:
          FORCE: ${{ inputs.force }}
          ONLY: ${{ inputs.only }}
        run: |
          args=(--published data/published)
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          for p in $ONLY; do args+=(--only "$p"); done
          uv run python scripts/release.py plan "${args[@]}"

      - if: steps.plan.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: data-pipeline/data/work/plan.json
          retention-days: 3

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build limes-cli
        working-directory: core
        run: cargo build --release -p limes-cli

      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: data-pipeline/data/work

      - name: Fetch published state
        run: |
          mkdir -p data/published/stats
          for f in state.json manifest.json; do
            aws s3 cp "$BUCKET/$f" data/published/ --endpoint-url "$R2_ENDPOINT" || echo "no $f yet"
          done
          aws s3 sync "$BUCKET/stats/" data/published/stats/ --endpoint-url "$R2_ENDPOINT"

      - name: Build and gate
        run: >-
          uv run python scripts/release.py build --region ${{ matrix.region }}
          --published data/published --dist data/dist --limes-cli ../core/target/release/limes-cli

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.region }}
          path: |
            data-pipeline/data/dist
            data-pipeline/data/work/built.json
            data-pipeline/data/work/failures.md
          compression-level: 0 # databases and tiles are already compressed
          retention-days: 3

  publish:
    needs: [plan, build]
    if: always() && needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: data-pipeline/data/work

      # A region whose job failed has no part; merge reports it.
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: data-pipeline/data/parts

      - name: Fetch published state
        run: |
          mkdir -p data/published
          for f in state.json manifest.json; do
            aws s3 cp "$BUCKET/$f" data/published/ --endpoint-url "$R2_ENDPOINT" || echo "no $f yet"
          done

      - name: Merge
        run: >-
          uv run python scripts/release.py merge --published data/published
          --parts data/parts --dist data/dist

      # Databases, tiles, stats and the JARTIC archive first; manifest.json
      # (what the apps read) and state.json only after them.
      - name: Upload
        run: |
          aws s3 sync data/dist/ "$BUCKET/" --endpoint-url "$R2_ENDPOINT" \
            --exclude manifest.json --exclude state.json
          for f in manifest.json state.json; do
            if [ -f "data/dist/$f" ]; then
              aws s3 cp "data/dist/$f" "$BUCKET/$f" --endpoint-url "$R2_ENDPOINT" \
                --content-type application/json --cache-control no-cache
            fi
          done

      # Old builds: keep the version in the manifest and the one before it.
      - name: Prune old databases
        if: hashFiles('data-pipeline/data/dist/manifest.json') != ''
        run: |
          aws s3api list-objects-v2 --bucket "${BUCKET#s3://}" --delimiter / \
            --endpoint-url "$R2_ENDPOINT" --output json > data/work/objects.json
          uv run python scripts/release.py prune --objects data/work/objects.json \
            --manifest data/dist/manifest.json > data/work/prune.txt
          while read -r key; do
            aws s3 rm "$BUCKET/$key" --endpoint-url "$R2_ENDPOINT"
          done < data/work/prune.txt

      - if: hashFiles('data-pipeline/data/work/failures.md') != ''
        name: Report failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Data release: build or gate failed"
          body="$(printf 'Run: %s/%s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"; cat data/work/failures.md)"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1
