# Daily: detect a new JARTIC release, rebuild the prefectures it changes, gate
# them and publish what passed to Cloudflare R2 (see data-pipeline/limes_pipeline/release.py).
#
#   plan        which prefectures to build, grouped by OSM region
#   boundaries  prefecture boundaries from the whole-Japan extract
#   build       one job per region, in parallel
#   publish     merge the regions' outputs, upload, prune old builds, report failures
#   mirror      copy manifest.json and the databases to https://limes.osprey74.com/data/,
#               which the apps read (the bucket itself is the pipeline's store)
#
# Repository settings:
#   secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (R2 API token, Object Read & Write)
#   variable R2_BUCKET
#   secrets MIRROR_FTP_USER, MIRROR_FTP_PASSWORD (FTP account limited to the limes.osprey74.com
#     folder; without them the mirror job does nothing)
#   variable MIRROR_FTP_DIR (the data folder as that account sees it; default /data)
name: data-release

on:
  schedule:
    - cron: "30 21 * * *" # 06:30 JST
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if built from the current release
        type: boolean
        default: false
      only:
        description: Prefectures to build, space separated (default all in prefectures.json)
        type: string
        default: ""
      accept_stage1:
        description: Let the gate pass a stage-1 change, once (rebuild after a pipeline change)
        type: boolean
        default: false
      mirror_only:
        description: Copy the bucket to limes.osprey74.com even when nothing is built
        type: boolean
        default: false

concurrency:
  group: data-release
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # Newer AWS CLI checksum headers are not needed by R2.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  BUCKET: s3://${{ vars.R2_BUCKET }}

defaults:
  run:
    working-directory: data-pipeline

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      regions: ${{ steps.plan.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: Fetch published state
        run: |
          mkdir -p data/published
          aws s3 cp "$BUCKET/state.json" data/published/ --endpoint-url "$R2_ENDPOINT" || echo "no state.json yet"

      - name: Plan
        id: plan
        env:
          FORCE: ${{ inputs.force }}
          ONLY: ${{ inputs.only }}
        run: |
          args=(--published data/published)
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          for p in $ONLY; do args+=(--only "$p"); done
          uv run python scripts/release.py plan "${args[@]}"

      - if: steps.plan.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: data-pipeline/data/work/plan.json
          retention-days: 3

  # Prefecture boundaries from the whole-Japan extract: region extracts cut off
  # sea boundaries beyond their edge (Tokyo, Okayama, Fukuoka).
  boundaries:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: Extract prefecture boundaries
        run: |
          mkdir -p data/work/osm
          curl -sSfL -A "limes-pipeline (+https://github.com/osprey74/limes)" \
            -o data/work/osm/japan-latest.osm.pbf https://download.geofabrik.de/asia/japan-latest.osm.pbf
          uv run python scripts/boundaries.py --pbf data/work/osm/japan-latest.osm.pbf \
            --out data/work/osm/japan.boundaries.geojson

      - uses: actions/upload-artifact@v4
        with:
          name: boundaries
          path: data-pipeline/data/work/osm/japan.boundaries.geojson
          retention-days: 3

  build:
    needs: [plan, boundaries]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build limes-cli
        working-directory: core
        run: cargo build --release -p limes-cli

      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: data-pipeline/data/work

      - uses: actions/download-artifact@v4
        with:
          name: boundaries
          path: data-pipeline/data/work/osm

      - name: Fetch published state
        run: |
          mkdir -p data/published/stats
          for f in state.json manifest.json; do
            aws s3 cp "$BUCKET/$f" data/published/ --endpoint-url "$R2_ENDPOINT" || echo "no $f yet"
          done
          aws s3 sync "$BUCKET/stats/" data/published/stats/ --endpoint-url "$R2_ENDPOINT"

      - name: Build and gate
        run: >-
          uv run python scripts/release.py build --region ${{ matrix.region }}
          --boundaries data/work/osm/japan.boundaries.geojson
          --published data/published --dist data/dist --limes-cli ../core/target/release/limes-cli
          ${{ inputs.accept_stage1 && '--accept-stage1' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.region }}
          path: |
            data-pipeline/data/dist
            data-pipeline/data/work/built.json
            data-pipeline/data/work/failures.md
          compression-level: 0 # databases are already compressed
          retention-days: 3

  publish:
    needs: [plan, build]
    if: always() && needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: data-pipeline/data/work

      # A region whose job failed has no part; merge reports it.
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: data-pipeline/data/parts

      - name: Fetch published state
        run: |
          mkdir -p data/published
          for f in state.json manifest.json; do
            aws s3 cp "$BUCKET/$f" data/published/ --endpoint-url "$R2_ENDPOINT" || echo "no $f yet"
          done

      - name: Merge
        run: >-
          uv run python scripts/release.py merge --published data/published
          --parts data/parts --dist data/dist

      # Databases, stats and the JARTIC archive first; manifest.json
      # (what the apps read) and state.json only after them.
      # R2 now and then rejects a multipart upload (InvalidPart); sync again
      # uploads only what is missing.
      - name: Upload
        run: |
          for attempt in 1 2 3; do
            aws s3 sync data/dist/ "$BUCKET/" --endpoint-url "$R2_ENDPOINT" \
              --exclude manifest.json --exclude state.json && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "sync failed, retrying ($attempt)"; sleep 30
          done
          for f in manifest.json state.json; do
            if [ -f "data/dist/$f" ]; then
              aws s3 cp "data/dist/$f" "$BUCKET/$f" --endpoint-url "$R2_ENDPOINT" \
                --content-type application/json --cache-control no-cache
            fi
          done

      # Old builds: keep the version in the manifest and the one before it.
      - name: Prune old databases
        if: hashFiles('data-pipeline/data/dist/manifest.json') != ''
        run: |
          aws s3api list-objects-v2 --bucket "${BUCKET#s3://}" --delimiter / \
            --endpoint-url "$R2_ENDPOINT" --output json > data/work/objects.json
          uv run python scripts/release.py prune --objects data/work/objects.json \
            --manifest data/dist/manifest.json > data/work/prune.txt
          while read -r key; do
            aws s3 rm "$BUCKET/$key" --endpoint-url "$R2_ENDPOINT"
          done < data/work/prune.txt

      - if: hashFiles('data-pipeline/data/work/failures.md') != ''
        name: Report failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Data release: build or gate failed"
          body="$(printf 'Run: %s/%s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"; cat data/work/failures.md)"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1

  # The bucket is the source: whatever it publishes after this run (also when
  # some prefectures failed and keep their versions) is copied as it is.
  mirror:
    needs: [plan, publish]
    if: >-
      always() && needs.plan.result == 'success' &&
      (inputs.mirror_only || (needs.publish.result != 'skipped' && needs.publish.result != 'cancelled'))
    runs-on: ubuntu-latest
    env:
      FTP_HOST: www1135.onamae.ne.jp # the name on the server's certificate (*.onamae.ne.jp)
      FTP_USER: ${{ secrets.MIRROR_FTP_USER }}
      LFTP_PASSWORD: ${{ secrets.MIRROR_FTP_PASSWORD }}
      FTP_DIR: ${{ vars.MIRROR_FTP_DIR || '/data' }}
      PUBLIC_URL: https://limes.osprey74.com/data/
    steps:
      - uses: actions/checkout@v4

      - name: Fetch what the bucket publishes
        if: env.FTP_USER != ''
        run: |
          mkdir -p data/mirror
          aws s3 cp "$BUCKET/manifest.json" data/mirror/ --endpoint-url "$R2_ENDPOINT"
          aws s3 sync "$BUCKET/" data/mirror/ --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" --include "*.sqlite.zst" --exclude "*/*"
          cp publish/htaccess data/mirror/.htaccess

      # Databases first, manifest.json after them, and only then the ones the
      # bucket no longer has. Names carry the version, so equal size means equal file.
      - name: Upload
        if: env.FTP_USER != ''
        run: |
          case "$FTP_DIR" in
            */data) ;;
            *) echo "::error::MIRROR_FTP_DIR must end in /data (the folder is cleaned to match the bucket)"; exit 1 ;;
          esac
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set cmd:fail-exit yes
            set ftp:ssl-force yes
            set ftp:ssl-protect-data yes
            set ssl:verify-certificate yes
            set ssl:check-hostname yes
            set net:max-retries 3
            set net:timeout 30
            open --user '$FTP_USER' --env-password ftp://$FTP_HOST
            mkdir -p -f '$FTP_DIR'
            cd '$FTP_DIR'
            mirror -R --ignore-time --no-perms --exclude-glob manifest.json data/mirror/ ./
            put data/mirror/manifest.json -o manifest.json
            mirror -R --ignore-time --no-perms --delete data/mirror/ ./
          "

      # What the apps will get: the same manifest, and every database it lists at its size.
      - name: Check the public copy
        if: env.FTP_USER != ''
        run: |
          agent="limes-pipeline (+https://github.com/osprey74/limes)"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS -A "$agent" -o data/public-manifest.json "${PUBLIC_URL}manifest.json" \
              && cmp -s data/public-manifest.json data/mirror/manifest.json; then
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "::error::${PUBLIC_URL}manifest.json is not the bucket's manifest"; exit 1
            fi
            sleep 20
          done
          jq -r '.prefectures[] | "\(.path) \(.size)"' data/mirror/manifest.json | while read -r path size; do
            got="$(curl -fsSI -A "$agent" "${PUBLIC_URL}$path" | tr -d '\r' \
              | awk 'tolower($1) == "content-length:" { print $2 }')"
            if [ "$got" != "$size" ]; then
              echo "::error::$path: expected $size bytes, got ${got:-no answer}"; exit 1
            fi
          done
